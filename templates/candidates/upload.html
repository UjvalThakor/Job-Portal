{% extends "base.html" %}
{% block title %}Upload Resumes{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:600px;margin:0 auto;">
  <h4 class="mb-3"><i class="bi bi-cloud-upload"></i> Upload Resumes</h4>
  <p class="text-muted">PDF, DOCX, PNG, or JPG. Scanned/image resumes are automatically run through OCR.</p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <input type="file" name="files" class="form-control" accept=".pdf,.docx,.png,.jpg,.jpeg" multiple required>
    </div>
    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-upload"></i> Upload &amp; Process</button>
  </form>
</div>
{% endblock %}
