<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AI HR System{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  body { background:#f4f6f9; }
  .navbar-brand { font-weight: 700; }
  .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-radius: 10px; }
  .score-badge { font-size: .95rem; padding: .35rem .65rem; border-radius: 8px; font-weight: 600; }
  .score-high { background:#d1f7dd; color:#116631; }
  .score-mid { background:#fff3cd; color:#8a6400; }
  .score-low { background:#fbdada; color:#9c1c1c; }
  .skill-chip { display:inline-block; background:#eef1f7; color:#33415c; padding:.2rem .6rem; border-radius:20px; font-size:.8rem; margin:2px; }
  .skill-chip.missing { background:#fde2e2; color:#9c1c1c; }
  .stat-card h2 { font-weight:700; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard:home' %}"><i class="bi bi-robot"></i> AI HR System</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'dashboard:home' %}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'candidates:upload' %}">Upload Resumes</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'candidates:list' %}">Candidates</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'jobs:list' %}">Job Descriptions</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/">Admin</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container my-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% else %}alert-warning{% endif %} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
